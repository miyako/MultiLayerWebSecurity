name: Check translation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Code blocks unchanged, figure references complete
        run: |
          tgt=$(python3 -c "import json;print(json.load(open('technote.json')).get('target_lang','ja'))")
          if ls document/*.pdf >/dev/null 2>&1 && [ -f src/en.md ] && [ -f "src/$tgt.md" ]; then
            make check
          else
            echo "Nothing to check yet (no PDF or no translation)."
          fi
